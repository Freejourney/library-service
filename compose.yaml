# 本地开发：仅数据库用 Docker，三个服务在本地 JVM 启动（见 README「快速开始」）
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: elibrary_db
      MYSQL_USER: elibrary
      MYSQL_PASSWORD: ${DB_PASSWORD:-elibrary-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
      TZ: UTC
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root-local}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
