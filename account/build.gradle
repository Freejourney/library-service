plugins {
    id 'org.springframework.boot'
}

dependencies {
    api project(':common')
    testImplementation project(':common')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

springBoot {
    mainClass = 'com.elibrary.account.AccountApplication'
}

tasks.named('bootJar') {
    archiveFileName = 'account-app.jar'
}
